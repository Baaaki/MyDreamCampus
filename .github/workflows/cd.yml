name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────
  # Detect which services changed (skip unchanged)
  # ─────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # shared/ is in every filter on purpose: it is compiled INTO each
          # image, so a change there makes ten images stale at once.
          filters: |
            auth-service:
              - 'new-backend/services/auth-service/**'
              - 'new-backend/shared/**'
            staff-service:
              - 'new-backend/services/staff-service/**'
              - 'new-backend/shared/**'
            student-service:
              - 'new-backend/services/student-service/**'
              - 'new-backend/shared/**'
            catalog-service:
              - 'new-backend/services/catalog-service/**'
              - 'new-backend/shared/**'
            enrollment-service:
              - 'new-backend/services/enrollment-service/**'
              - 'new-backend/shared/**'
            attendance-service:
              - 'new-backend/services/attendance-service/**'
              - 'new-backend/shared/**'
            grades-service:
              - 'new-backend/services/grades-service/**'
              - 'new-backend/shared/**'
            meal-service:
              - 'new-backend/services/meal-service/**'
              - 'new-backend/shared/**'
            payment-service:
              - 'new-backend/services/payment-service/**'
              - 'new-backend/shared/**'
            notification-service:
              - 'new-backend/services/notification-service/**'
              - 'new-backend/shared/**'

  # ─────────────────────────────────────────────
  # Build & push changed services to GHCR
  # ─────────────────────────────────────────────
  build-push:
    needs: changes
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mydreamcampus-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          # Repo root, matching compose: every service Dockerfile copies both
          # its own directory and new-backend/shared, so a context rooted at
          # the service cannot see its replace target.
          context: .
          file: ./new-backend/services/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mydreamcampus-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
