name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"
  # Tool versions are pinned: a "latest" that moves under an unchanged commit
  # turns CI red (or green) for reasons that are not in the diff.
  BUN_VERSION: "1.4.2"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'new-backend/**'
            frontend:
              - 'frontend/**'
            mobile:
              - 'mobile/**'
            infra:
              - 'new-backend/infrastructure/**'

  # One job per Go module. A failure names its own service in the job title,
  # which a single looping job cannot do — with ten services, "backend-test
  # failed" is not an answer. fail-fast is off so one broken service does not
  # hide the state of the other nine.
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - shared
          - services/auth-service
          - services/staff-service
          - services/student-service
          - services/catalog-service
          - services/enrollment-service
          - services/attendance-service
          - services/grades-service
          - services/meal-service
          - services/payment-service
          - services/notification-service
    defaults:
      run:
        working-directory: new-backend/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: new-backend/**/go.sum

      - name: go vet
        run: go vet ./...

      # v6 of the action only installs golangci-lint v1, whose binaries are
      # built with a Go older than this module's go directive.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Lint
        run: golangci-lint run --timeout=5m ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::new-backend/${{ matrix.module }}/go.mod is not tidy. Run 'go mod tidy' locally."
            exit 1
          fi

  # End-to-end smoke test against the real stack: compose builds and starts all
  # 16 containers, the seed writes through the actual admin API, and the golden
  # path is replayed through Caddy. It is the only job that proves the SPLIT
  # works — per-module tests pass just as happily when a service cannot reach
  # its peer or an event never arrives.
  backend-e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: new-backend/infrastructure
    steps:
      - uses: actions/checkout@v7

      - name: Write .env
        # http:// on PUBLIC_HOST keeps Caddy's automatic HTTPS off — with a
        # bare hostname every :80 request answers 308 to a certificate that
        # cannot be issued for a runner.
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-postgres-password
          SERVICE_DB_PASSWORD=ci0service0db0password
          REDIS_PASSWORD=ci-redis-password
          RABBITMQ_USER=rabbitmq
          RABBITMQ_PASSWORD=ci-rabbitmq-password
          JWT_SECRET=ci-jwt-secret-at-least-32-bytes-long-x
          INTERNAL_SERVICE_SECRET=ci-internal-secret-at-least-32-bytes-x
          QR_SECRET=ci-qr-secret-at-least-32-bytes-long-xxxx
          ADMIN_EMAIL=admin@university.edu.tr
          ADMIN_INITIAL_PASSWORD=ci-admin-password
          SEED_DEMO=true
          DEMO_MODE=true
          DEMO_ADMIN_EMAIL=demo.admin@mydreamcampus.com
          DEMO_TEACHER_EMAIL=ahmet.yilmaz@uni.edu.tr
          DEMO_STUDENT_EMAIL=zeynep.sahin@uni.edu.tr
          PROTECTED_ACCOUNT_EMAILS=admin@university.edu.tr,demo.admin@mydreamcampus.com,ahmet.yilmaz@uni.edu.tr,zeynep.sahin@uni.edu.tr
          PUBLIC_HOST=http://localhost
          PUBLIC_ORIGIN=http://localhost
          EOF

      - name: Build images
        # One Go service first, then the rest. Built all at once on a fresh
        # runner, every Go image starts a cold compile of the same dependency
        # tree side by side: on a builder capped like the runner (4 CPUs,
        # 16 GB) that took 9 minutes and 10 GB, and here the step ran past
        # the job timeout in most runs. auth-service fills the shared BuildKit
        # cache mounts, so the rest compile only their own packages: 2.5
        # minutes and 2.5 GB on the same builder.
        timeout-minutes: 15
        run: |
          docker compose -f docker-compose.yml --progress plain build auth-service
          docker compose -f docker-compose.yml --progress plain build

      - name: Start the stack
        # up waits for the seed to exit, since demo-ops starts after it. A
        # seed that hangs has to fail this step, which collects the logs,
        # instead of using up the job.
        timeout-minutes: 10
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for the edge
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost/health > /dev/null; then
              echo "edge healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::caddy /health did not answer within 90s"
          exit 1

      - name: Wait for the seed to finish
        # The seed is the first real exercise of the chain: it logs in as admin
        # and creates teachers, courses and students through each service's own
        # API, so a non-zero exit here already means a broken seam.
        run: |
          for i in $(seq 1 180); do
            state=$(docker inspect -f '{{.State.Status}}' mydreamcampus-seed 2>/dev/null || echo missing)
            if [ "$state" = "exited" ]; then
              code=$(docker inspect -f '{{.State.ExitCode}}' mydreamcampus-seed)
              [ "$code" = "0" ] && { echo "seed completed"; exit 0; }
              echo "::error::seed exited with code $code"
              exit 1
            fi
            sleep 2
          done
          echo "::error::seed did not finish within 360s"
          exit 1

      - name: Golden path through the edge
        # Every request goes through Caddy, so each step also asserts that the
        # path prefix still routes to the service that owns it.
        run: |
          set -eu
          # The seed spends most of the admin's per-user budget (200 a minute,
          # one bucket across every service) moments before this step starts,
          # so a 429 is waited out, not failed on. Rate limiting is not what
          # this job tests.
          api() {
            for _ in $(seq 1 40); do
              code=$(curl -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' "$@")
              [ "$code" = 429 ] || break
              sleep "$(awk 'tolower($1) == "retry-after:" { print $2 + 0 }' /tmp/headers | grep . || echo 2)"
            done
            echo "$code"
          }
          expect() {
            want="$1"; got="$2"; what="$3"
            if [ "$got" != "$want" ]; then
              echo "::error::$what — expected $want, got $got: $(head -c 300 /tmp/body)"
              exit 1
            fi
            echo "ok  [$got] $what"
          }

          code=$(api -X POST http://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@university.edu.tr","password":"ci-admin-password"}')
          expect 200 "$code" "admin login (auth)"
          TOKEN=$(jq -r '.access_token' /tmp/body)
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::no access_token"; exit 1; }

          code=$(api http://localhost/api/staff -H "Authorization: Bearer $TOKEN")
          expect 200 "$code" "list staff (staff)"

          # Its own prefix, mounted outside /api/staff: this proves the Caddy
          # rule, the migration and the seed rows in one request.
          code=$(api "http://localhost/api/admin-staff?faculty=Fen%20Fak%C3%BCltesi" -H "Authorization: Bearer $TOKEN")
          expect 200 "$code" "list administrative staff (staff, /api/admin-staff)"
          [ "$(jq '.data | length' /tmp/body)" -ge 1 ] || { echo "::error::no administrative staff seeded"; exit 1; }

          code=$(api "http://localhost/api/catalog/courses?limit=100")
          expect 200 "$code" "list courses (catalog)"
          [ "$(jq '.pagination.total' /tmp/body)" -eq 91 ] || { echo "::error::expected 91 seeded courses, got $(jq '.pagination.total' /tmp/body)"; exit 1; }

          # Public, like the course list: the faculty filters are built from it.
          code=$(api http://localhost/api/catalog/faculties)
          expect 200 "$code" "list faculties (catalog)"
          [ "$(jq '.data | length' /tmp/body)" -eq 19 ] || { echo "::error::expected 19 seeded faculties"; exit 1; }

          code=$(api http://localhost/api/students -H "Authorization: Bearer $TOKEN")
          expect 200 "$code" "list students (student)"

          # A seeded teacher can only log in if staff's creation event reached
          # auth and its user projection was written — the async half of the
          # split, which no per-service test can see.
          code=$(api -X POST http://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ahmet.yilmaz@uni.edu.tr","password":"ahmet.yilmaz@uni.edu.tr"}')
          expect 200 "$code" "seeded teacher login (staff event -> auth projection)"

          # Course selection: enrollment resolves the student through student
          # AND the offering list through catalog, both over internal REST.
          code=$(api -X POST http://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"zeynep.sahin@uni.edu.tr","password":"zeynep.sahin@uni.edu.tr"}')
          expect 200 "$code" "seeded student login (student event -> auth projection)"
          STUDENT_TOKEN=$(jq -r '.access_token' /tmp/body)

          code=$(api http://localhost/api/admin-staff -H "Authorization: Bearer $STUDENT_TOKEN")
          expect 403 "$code" "administrative staff directory is admin-only"

          # The seed names its semesters after the day it runs, so the
          # active one is read back rather than spelled out here.
          code=$(api http://localhost/api/catalog/admin/semesters/active -H "Authorization: Bearer $TOKEN")
          expect 200 "$code" "active semester (catalog)"
          SEMESTER=$(jq -r '.name | @uri' /tmp/body)

          code=$(api "http://localhost/api/enrollment/available-courses?semester=$SEMESTER" \
            -H "Authorization: Bearer $STUDENT_TOKEN")
          expect 200 "$code" "available courses (enrollment -> student + catalog)"

          code=$(api "http://localhost/api/enrollment/my-enrollments?semester=$SEMESTER" \
            -H "Authorization: Bearer $STUDENT_TOKEN")
          expect 200 "$code" "demo student's program (enrollment)"
          [ "$(jq -r '.programs[0].status' /tmp/body)" = approved ] \
            || { echo "::error::the demo student has no approved program this semester"; exit 1; }

          # Time machine: catalog stores the offset in Redis and every other
          # service picks it up, from the pub/sub message or at the latest on
          # its 10-second re-read.
          wait_clock() {
            svc="$1"; want_active="$2"; want_offset="$3"
            for i in $(seq 1 15); do
              code=$(api "http://localhost/api/$svc/admin/time/status" -H "Authorization: Bearer $TOKEN")
              if [ "$code" = 200 ] \
                && [ "$(jq -r .active /tmp/body)" = "$want_active" ] \
                && [ "$(jq -r .offset_seconds /tmp/body)" = "$want_offset" ]; then
                echo "ok  [$code] $svc clock active=$want_active offset=$want_offset"
                return 0
              fi
              sleep 1
            done
            echo "::error::$svc clock never reached active=$want_active offset=$want_offset: $(head -c 300 /tmp/body)"
            exit 1
          }

          TARGET=$(date -u -d '+1 year' +%Y-%m-%dT%H:%M:%SZ)
          code=$(api -X POST http://localhost/api/catalog/admin/time/simulate \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"time\":\"$TARGET\"}")
          expect 200 "$code" "simulate one year ahead (catalog)"
          OFFSET=$(jq -r '.offset_seconds' /tmp/body)

          wait_clock grades true "$OFFSET"
          wait_clock meals true "$OFFSET"
          wait_clock payments true "$OFFSET"
          drift=$(( $(date -u -d "$(jq -r .current_time /tmp/body)" +%s) - $(date -u -d "$TARGET" +%s) ))
          [ "${drift#-}" -le 120 ] || { echo "::error::simulated clock is ${drift}s away from $TARGET"; exit 1; }

          # Tokens stay on the real clock: one issued a year "ahead" must work.
          code=$(api -X POST http://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@university.edu.tr","password":"ci-admin-password"}')
          expect 200 "$code" "admin login under the time machine (auth)"
          SIM_TOKEN=$(jq -r '.access_token' /tmp/body)
          code=$(api http://localhost/api/staff -H "Authorization: Bearer $SIM_TOKEN")
          expect 200 "$code" "token issued under the time machine is accepted (staff)"

          code=$(api -X POST http://localhost/api/catalog/admin/time/simulate \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"time\":\"$(date -u -d '+3 years' +%Y-%m-%dT%H:%M:%SZ)\"}")
          expect 400 "$code" "simulating beyond two years is rejected"

          code=$(api -X POST http://localhost/api/catalog/admin/time/reset -H "Authorization: Bearer $TOKEN")
          expect 200 "$code" "reset to the real clock (catalog)"
          wait_clock grades false 0
          wait_clock meals false 0
          wait_clock payments false 0

          # Card checkout: meal reserves and opens a pending payment over
          # internal REST, the card settles it through Caddy, and payment's
          # outbox event reaches meal's consumer — the reservation's status
          # is the only place that last hop shows.
          code=$(api http://localhost/api/meals/cafeterias -H "Authorization: Bearer $STUDENT_TOKEN")
          expect 200 "$code" "list cafeterias (meal)"
          CAFETERIA=$(jq -r '.data.cafeterias[0].id' /tmp/body)

          # Next week's Thursday and Friday: the seed books Monday-Wednesday.
          DOW=$(date -u +%u)
          THU=$(date -u -d "-$((DOW - 1)) days +10 days" +%F)
          FRI=$(date -u -d "-$((DOW - 1)) days +11 days" +%F)

          checkout() {
            # Not "want": expect() sets that global, and sh has no locals.
            day="$1"; card="$2"; want_status="$3"
            code=$(api -X POST http://localhost/api/meals/reservations/batch \
              -H "Authorization: Bearer $STUDENT_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"reservations\":[{\"cafeteria_id\":\"$CAFETERIA\",\"date\":\"$day\",\"meal_time\":\"lunch\",\"menu_type\":\"normal\"}]}")
            expect 200 "$code" "reserve $day lunch (meal -> payment initiate)"
            PAYMENT=$(jq -r '.data.payment_id' /tmp/body)
            RESERVATION=$(jq -r '.data.reservations[0].id' /tmp/body)
            [ "$(jq -r '.data.reservations[0].status' /tmp/body)" = pending ] \
              || { echo "::error::a new reservation must wait for its payment"; exit 1; }

            code=$(api -X POST "http://localhost/api/payments/$PAYMENT/confirm" \
              -H "Authorization: Bearer $STUDENT_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"card_number\":\"$card\",\"exp_month\":12,\"exp_year\":2030,\"cvc\":\"123\",\"cardholder_name\":\"Zeynep Sahin\"}")
            expect 200 "$code" "confirm with $card (payment)"

            for i in $(seq 1 30); do
              code=$(api "http://localhost/api/meals/reservations/my?from_date=$day&to_date=$day" \
                -H "Authorization: Bearer $STUDENT_TOKEN")
              status=$(jq -r --arg id "$RESERVATION" '.data.reservations[]? | select(.id == $id) | .status' /tmp/body)
              if [ "$code" = 200 ] && [ "$status" = "$want_status" ]; then
                echo "ok  [$code] reservation $day is $want_status (payment event -> meal)"
                return 0
              fi
              sleep 1
            done
            echo "::error::reservation $day never became $want_status (last: $status)"
            exit 1
          }

          checkout "$THU" 4242424242424242 confirmed
          checkout "$FRI" 4000000000000002 cancelled

          code=$(api -X POST "http://localhost/api/payments/$PAYMENT/confirm" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H 'Content-Type: application/json' \
            -d '{"card_number":"4242424242424242","exp_month":12,"exp_year":2030,"cvc":"123","cardholder_name":"Zeynep Sahin"}')
          expect 409 "$code" "a settled payment cannot be charged again"

          code=$(api "http://localhost/api/payments/$PAYMENT" -H "Authorization: Bearer $TOKEN")
          expect 403 "$code" "payments are for their student only"

          # No token must never be served. A real route: /api/grades alone
          # matches nothing and answers 404 before any auth runs.
          code=$(api http://localhost/api/grades/my/grades)
          expect 401 "$code" "unauthenticated request is rejected (grades)"

          # ── Permanent state & demo-ops cycle (Phase 7) ─────────────────
          # The ops endpoints only queue a command; demo-ops stamps the status
          # with the command's id once it has handled it. Waiting on the mode
          # alone would read a status written before the command was picked up.
          ops_run() {
            ops_path="$1"; want_mode="$2"
            code=$(api -X POST "http://localhost/api/catalog/admin/ops/$ops_path" -H "Authorization: Bearer $TOKEN")
            expect 202 "$code" "ops $ops_path queued (catalog)"
            cmd=$(jq -r '.command_id' /tmp/body)
            for _ in $(seq 1 180); do
              code=$(api http://localhost/api/catalog/admin/ops/status -H "Authorization: Bearer $TOKEN")
              if [ "$code" = 200 ] && [ "$(jq -r '.last_command_id // empty' /tmp/body)" = "$cmd" ] \
                && [ "$(jq -r '.mode' /tmp/body)" != busy ]; then
                break
              fi
              sleep 1
            done
            [ "$(jq -r '.last_command_id // empty' /tmp/body)" = "$cmd" ] \
              || { echo "::error::demo-ops never handled $ops_path: $(head -c 300 /tmp/body)"; exit 1; }
            ops_mode=$(jq -r '.mode' /tmp/body)
            ops_error=$(jq -r '.last_error // empty' /tmp/body)
            if [ "$ops_mode" != "$want_mode" ] || [ -n "$ops_error" ]; then
              echo "::error::ops $ops_path ended in mode $ops_mode (want $want_mode): $ops_error"
              exit 1
            fi
            echo "ok  ops $ops_path -> $ops_mode (demo-ops)"
          }
          course_json() {
            printf '{"course_code":"%s","name":"%s","faculty":"Mühendislik Fakültesi","department":"Bilgisayar Mühendisliği","class_level":1,"course_type":"elective","credits":3,"ects":5}' "$1" "$2"
          }

          # The access token from the start of the job may be near its 15 minutes.
          code=$(api -X POST http://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@university.edu.tr","password":"ci-admin-password"}')
          expect 200 "$code" "super admin login (auth)"
          TOKEN=$(jq -r '.access_token' /tmp/body)

          # 1. demo-ops is up and has taken the first permanent state. A status
          # with no updated_at is catalog's default: demo-ops has not written
          # yet. The first snapshot may meet this job's own events and be
          # retried a minute later, hence the long wait.
          state=$(docker inspect -f '{{.State.Status}}' mydreamcampus-demo-ops 2>/dev/null || echo missing)
          [ "$state" = "running" ] || { echo "::error::demo-ops is not running"; exit 1; }
          for _ in $(seq 1 300); do
            code=$(api http://localhost/api/catalog/admin/ops/status -H "Authorization: Bearer $TOKEN")
            [ "$code" = 200 ] && [ "$(jq -r '.mode' /tmp/body)" = normal ] \
              && [ -n "$(jq -r '.updated_at // empty' /tmp/body)" ] && break
            sleep 1
          done
          expect 200 "$code" "get ops status (catalog)"
          [ -n "$(jq -r '.current // empty' /tmp/body)" ] \
            || { echo "::error::demo-ops has no initial baseline: $(head -c 300 /tmp/body)"; exit 1; }

          # 2. The super admin starts editing: everyone else's writes are locked.
          ops_run begin-edit editing

          code=$(api -X POST http://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo.admin@mydreamcampus.com","password":"demo.admin@mydreamcampus.com"}')
          expect 200 "$code" "demo admin login while the super admin edits (auth)"
          DEMO_ADMIN_TOKEN=$(jq -r '.access_token' /tmp/body)
          code=$(api -X POST http://localhost/api/catalog/courses \
            -H "Authorization: Bearer $DEMO_ADMIN_TOKEN" -H 'Content-Type: application/json' \
            -d "$(course_json CS777 'Locked Course')")
          expect 503 "$code" "demo admin write is locked during edit mode (catalog)"
          [ "$(jq -r '.code' /tmp/body)" = SYSTEM_EDITING ] \
            || { echo "::error::locked write did not answer SYSTEM_EDITING"; exit 1; }

          # 3. The super admin adds a permanent course and saves.
          code=$(api -X POST http://localhost/api/catalog/courses \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "$(course_json CS999 'Permanent Course')")
          expect 201 "$code" "super admin creates course during edit mode (catalog)"
          ops_run save normal

          # 4. A visitor's change after the save is temporary.
          code=$(api -X POST http://localhost/api/catalog/courses \
            -H "Authorization: Bearer $DEMO_ADMIN_TOKEN" -H 'Content-Type: application/json' \
            -d "$(course_json CS888 'Temporary Course')")
          expect 201 "$code" "demo admin creates temporary course (catalog)"
          code=$(api http://localhost/api/catalog/courses/CS888)
          expect 200 "$code" "CS888 exists before restore"

          # 5. Restoring drops the visitor's course and keeps the saved one.
          ops_run restore-now normal
          code=$(api http://localhost/api/catalog/courses/CS888)
          expect 404 "$code" "demo admin temporary course CS888 is wiped after restore"
          code=$(api http://localhost/api/catalog/courses/CS999)
          expect 200 "$code" "super admin permanent course CS999 remains after restore"

      - name: Collect logs on failure
        if: failure()
        run: |
          {
            docker compose -f docker-compose.yml ps -a
            docker compose -f docker-compose.yml logs --no-color --tail=400
          } > compose-logs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: new-backend/infrastructure/compose-logs.txt

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # gosec and govulncheck run in security.yml — on every push and PR and on
  # a weekly schedule that catches CVEs published against unchanged code.

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: bun run typecheck

      - name: Unit tests (Vitest)
        run: bun run test

      - name: ESLint
        run: bun run lint

      - name: Prettier format check
        run: bunx prettier --check "**/*.{ts,tsx}"

      - name: Build
        run: bun run build

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Jest unit tests
        run: npm test -- --ci

  ci-passed:
    if: always()
    needs:
      - backend
      - backend-e2e
      - frontend
      - mobile
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          results=("${{ needs.backend.result }}" \
                   "${{ needs.backend-e2e.result }}" \
                   "${{ needs.frontend.result }}" \
                   "${{ needs.mobile.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::One or more required jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All CI checks passed!"
