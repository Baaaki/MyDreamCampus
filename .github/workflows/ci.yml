name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  BUN_VERSION: "latest"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'new-backend/**'
            frontend:
              - 'frontend/**'
            mobile:
              - 'mobile/**'
            infra:
              - 'new-backend/infrastructure/**'

  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: new-backend/**/go.sum

      - name: Run go vet
        run: |
          (cd shared && go vet ./...)
          (cd services/notification && go vet ./...)
          (cd monolith && go vet ./...)

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-only: true

      - name: Lint
        run: |
          (cd shared && golangci-lint run --timeout=5m ./...)
          (cd services/notification && golangci-lint run --timeout=5m ./...)
          (cd monolith && golangci-lint run --timeout=5m ./...)

  backend-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: new-backend/**/go.sum

      - name: Build components
        run: |
          (cd shared && go build ./...)
          (cd services/notification && go build -o /dev/null ./cmd/...)
          (cd monolith && make build)

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: new-backend/**/go.sum

      - name: Test
        run: |
          (cd shared && go test -race -count=1 ./...)
          (cd services/notification && go test -race -count=1 ./...)
          (cd monolith && make test)

  backend-integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: new-backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydreamcampus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      rabbitmq:
        image: rabbitmq:4.2-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: rabbitmq
          RABBITMQ_DEFAULT_PASS: rabbitmq
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20

    env:
      INTEGRATION_TESTS: "true"
      RABBITMQ_URL: "amqp://rabbitmq:rabbitmq@localhost:5672/"
      REDIS_ADDR: "localhost:6379"
      REDIS_PASSWORD: ""
      JWT_SECRET: "ci-test-secret-not-for-production"
      INTERNAL_SERVICE_SECRET: "ci-test-internal-secret"
      ENVIRONMENT: "test"
      DB_URL: "postgresql://postgres:postgres@localhost:5432/mydreamcampus?sslmode=disable"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: new-backend/**/go.sum

      - name: Install goose for migrations
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Apply migrations for monolith
        run: |
          cd monolith
          make migrate-up-all

      - name: Build monolith and notification
        run: |
          mkdir -p tmp/bin
          (cd monolith && make build && cp bin/monolith ../tmp/bin/)
          (cd services/notification && go build -o ../../tmp/bin/notification ./cmd/...)

      - name: Start monolith in the background
        run: |
          mkdir -p tmp/logs
          PORT=8080 nohup tmp/bin/monolith > tmp/logs/monolith.log 2>&1 &
          echo $! > tmp/logs/monolith.pid
          echo "started monolith on :8080"

      - name: Wait for monolith health check
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8080/health" > /dev/null; then
              echo "monolith healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::monolith did not become healthy in 60s"
              exit 1
            fi
            sleep 1
          done

      - name: Dump service logs on failure
        if: failure()
        run: |
          for f in tmp/logs/*.log; do
            echo "::group::log $(basename "$f")"
            tail -n 300 "$f"
            echo "::endgroup::"
          done

      - name: Stop services
        if: always()
        run: |
          for f in tmp/logs/*.pid; do
            [ -f "$f" ] || continue
            pid=$(cat "$f")
            kill "$pid" 2>/dev/null || true
          done

  backend-security:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: new-backend/**/go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: |
          failed=0
          (cd shared && gosec -severity medium -confidence medium ./...) || failed=1
          (cd services/notification && gosec -severity medium -confidence medium ./...) || failed=1
          (cd monolith && gosec -severity medium -confidence medium ./...) || failed=1
          exit $failed

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          failed=0
          (cd shared && govulncheck ./...) || failed=1
          (cd services/notification && govulncheck ./...) || failed=1
          (cd monolith && govulncheck ./...) || failed=1
          exit $failed

  backend-deps:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: new-backend/**/go.sum

      - name: Check go.mod tidiness
        run: |
          for dir in shared services/notification monolith; do
            (cd "$dir" && go mod tidy)
            if ! git diff --exit-code "${dir}/go.mod" "${dir}/go.sum"; then
              echo "::error::${dir}/go.mod is not tidy. Run 'go mod tidy' locally."
              exit 1
            fi
          done

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Prettier format check
        run: bunx prettier --check "**/*.{ts,tsx}"

      - name: Build
        run: bun run build

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Jest unit tests
        run: npm test -- --ci

  ci-passed:
    if: always()
    needs:
      - backend-lint
      - backend-build
      - backend-test
      - backend-integration
      - backend-security
      - backend-deps
      - frontend
      - mobile
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          results=("${{ needs.backend-lint.result }}" \
                   "${{ needs.backend-build.result }}" \
                   "${{ needs.backend-test.result }}" \
                   "${{ needs.backend-integration.result }}" \
                   "${{ needs.backend-security.result }}" \
                   "${{ needs.backend-deps.result }}" \
                   "${{ needs.frontend.result }}" \
                   "${{ needs.mobile.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::One or more required jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All CI checks passed!"
