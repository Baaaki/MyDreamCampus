name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────
  # Enforce conventional-commit style PR titles
  # Matches CLAUDE.md commit format: <type>(<scope>): <description>
  # ─────────────────────────────────────────────
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            ci
            build
            revert
          scopes: |
            auth
            staff
            student
            catalog
            enrollment
            attendance
            grades
            meal
            payment
            shared
            infra
            frontend
            mobile
            ci
            docs
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            The PR subject "{subject}" is invalid.
            Subject must start with lowercase and not end with a period.
            Example: feat(auth): add refresh token endpoint
