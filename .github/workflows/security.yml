name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday 06:00 UTC — catches new CVEs in pinned deps
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─────────────────────────────────────────────
  # Secret scanning — block committed credentials
  # ─────────────────────────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # gosec — Go SAST (crypto misuse, injection, file perms)
  # Only generated code (sqlc, protobuf) is excluded; all findings in
  # hand-written code are fixed at the source (clamped int conversions,
  # checked errors, context.WithoutCancel for detached workers).
  # ─────────────────────────────────────────────
  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: new-backend/monolith/go.mod
          cache-dependency-path: new-backend/**/go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        working-directory: new-backend
        run: |
          for mod in monolith shared services/notification; do
            echo "::group::gosec $mod"
            (cd "$mod" && gosec -quiet -exclude-generated ./...)
            echo "::endgroup::"
          done

  # ─────────────────────────────────────────────
  # govulncheck — reachable known CVEs in deps + stdlib
  # Fails only on vulnerabilities the code actually calls.
  # ─────────────────────────────────────────────
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: new-backend/monolith/go.mod
          cache-dependency-path: new-backend/**/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: new-backend
        run: |
          for mod in monolith shared services/notification; do
            echo "::group::govulncheck $mod"
            (cd "$mod" && govulncheck ./...)
            echo "::endgroup::"
          done

  # ─────────────────────────────────────────────
  # CodeQL — SAST for Go and JS/TS
  # ─────────────────────────────────────────────
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: new-backend/**/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build Go components
        if: matrix.language == 'go'
        working-directory: new-backend
        run: |
          (cd shared && go build ./...)
          (cd services/notification && go build ./...)
          (cd monolith && make build)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
