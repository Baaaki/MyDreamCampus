# Standalone overlay — for running the stack with Caddy as the outermost edge.
#
# The base compose publishes only caddy's :80, the single door an outer edge
# (Cloudflare Tunnel, a VPS reverse proxy) connects to. Anything else published
# there would collide with an edge that owns the host's :80/:443.
#
# Without such an edge, Caddy is itself the outermost one and the infra
# ports are a genuine convenience (psql, redis-cli, the RabbitMQ and MailHog
# UIs), so this overlay adds them back. Every infra port binds to 127.0.0.1 —
# only the host reaches them; Caddy stays the single externally reachable door.
#
# Every host-side port is overridable: these are conveniences, and a machine
# that already runs some other Postgres or Redis should not be forced to choose
# between them. Nothing inside the stack is affected — services reach each
# other over the compose network on the container port, never the host one.
#
# Loaded automatically by every `make` target. By hand:
#   docker compose -f docker-compose.yml -f docker-compose.standalone.yml up -d
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_HOST_PORT:-15672}:15672"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  mailhog:
    ports:
      - "127.0.0.1:${MAILHOG_SMTP_HOST_PORT:-1025}:1025"  # SMTP
      - "127.0.0.1:${MAILHOG_UI_HOST_PORT:-8025}:8025"    # Web UI

  caddy:
    # Caddy is the outermost edge here, so it terminates TLS itself: a real
    # Let's Encrypt cert when PUBLIC_HOST is a public hostname, its internal CA
    # otherwise. Rootless Docker cannot bind 443, hence the override.
    ports:
      - "${HTTPS_PORT:-443}:443"
