# Cloudflare Tunnel edge overlay.
# Replaces host-published Caddy ports with an internal Cloudflare Tunnel daemon
# container talking to Caddy over the Docker bridge network.
services:
  caddy:
    ports: !reset []

  cloudflared:
    # Pinned, but Cloudflare only supports releases younger than a year:
    # an older connector may stop reaching the edge. Bump at least yearly.
    image: cloudflare/cloudflared:2026.9.3
    container_name: mydreamcampus-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required when EDGE=tunnel}
    depends_on:
      - caddy
