# MyDreamCampus modular monolith — full stack.
# Infra (postgres x2, rabbitmq, redis, mailhog) + app (migrate, monolith,
# notification worker, caddy edge). Infra ports bind to 127.0.0.1 so only the
# host reaches them; caddy is the single public entrypoint on 80/443.

name: mydreamcampus

services:
  postgres:
    image: postgres:18
    container_name: mydreamcampus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}
      POSTGRES_DB: mydreamcampus
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-dbs.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydreamcampus"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-postgres:
    image: postgres:18
    container_name: mydreamcampus-notification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}
      POSTGRES_DB: notification
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql
      - ./postgres/init-notification-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mydreamcampus-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required — see .env.example}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mydreamcampus-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required — see .env.example}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-changeme_redis_secret}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — see .env.example}

  mailhog:
    image: mailhog/mailhog
    container_name: mydreamcampus-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # Web UI

  # One-shot: applies every module's goose migrations, then exits. The monolith
  # and notification wait for this to finish successfully before starting.
  migrate:
    build:
      context: ..
      dockerfile: infrastructure/migrate/Dockerfile
    image: mydreamcampus-migrate:latest
    container_name: mydreamcampus-migrate
    restart: "no"
    environment:
      DB_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}@postgres:5432/mydreamcampus?sslmode=disable
      NOTIF_DB_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}@notification-postgres:5432/notification?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      notification-postgres:
        condition: service_healthy

  monolith:
    build:
      context: ..
      dockerfile: monolith/Dockerfile
    image: mydreamcampus-monolith:latest
    container_name: mydreamcampus-monolith
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PORT: "8080"
      DB_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}@postgres:5432/mydreamcampus?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rabbitmq}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required — see .env.example}@rabbitmq:5672/
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env}
      QR_SECRET: ${QR_SECRET:?set QR_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@university.edu.tr}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD in .env}
      # SPA is served by caddy, not the monolith. Same origin -> CORS matches
      # the public URL the browser uses.
      FRONTEND_STATIC_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  notification:
    build:
      context: ..
      dockerfile: services/notification/Dockerfile
    image: mydreamcampus-notification:latest
    container_name: mydreamcampus-notification
    restart: unless-stopped
    environment:
      NOTIF_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}@notification-postgres:5432/notification?sslmode=disable
      NOTIF_RABBITMQ_URL: amqp://${RABBITMQ_USER:-rabbitmq}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required — see .env.example}@rabbitmq:5672/
      NOTIF_SMTP_HOST: mailhog
      NOTIF_SMTP_PORT: "1025"
      NOTIF_APP_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
    expose:
      - "9090"
    depends_on:
      notification-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-shot: seeds demo teachers/courses/students via the admin API once the
  # monolith is up. Idempotent (skips if demo data exists). SEED_DEMO=false in
  # .env disables it.
  seed:
    build:
      context: ./seed
    image: mydreamcampus-seed:latest
    container_name: mydreamcampus-seed
    restart: "no"
    environment:
      API_URL: http://monolith:8080
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@university.edu.tr}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD in .env}
      DB_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}@postgres:5432/mydreamcampus?sslmode=disable
    depends_on:
      monolith:
        condition: service_started

  # Public edge: serves the SPA and reverse-proxies /api to the monolith.
  # Fetches a real Let's Encrypt cert for SITE_ADDRESS automatically.
  caddy:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: mydreamcampus-caddy:latest
    container_name: mydreamcampus-caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${PUBLIC_HOST:-localhost}
    # Host-side ports are overridable because rootless Docker cannot bind
    # below 1024 without extra capabilities: HTTP_PORT=8080 works unprivileged.
    # Caddy always listens on 80/443 inside the container.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - monolith

volumes:
  postgres-data:
  notification-postgres-data:
  rabbitmq-data:
  redis-data:
  caddy-data:
  caddy-config:
