# MyDreamCampus microservices — full stack.
# Infra (postgres, rabbitmq, redis, mailhog) + app (migrate, nine business
# services, notification worker, seed, caddy edge). Caddy on :80 is the single
# entrypoint; everything else is reachable only over the compose network.
#
# This file publishes exactly ONE host port (caddy's :80) — the single door an
# outer edge needs, which is all Cloudflare Tunnel connects to.
# `docker-compose.standalone.yml` adds caddy's :443 and the infra loopback
# ports back for running Caddy as the outermost edge; the Makefile loads both.

name: mydreamcampus

# ── Shared service fragments ────────────────────────────────────────────────
# Nine services differ only in port, database and a couple of URLs. Spelling
# the common half out nine times is how one of them silently drifts — a new
# variable added to eight services and forgotten on the ninth fails at runtime,
# not at parse time.

# Unbounded json-file logs from 16 containers fill a home server's disk. 30 MB
# per container, ~480 MB total.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Every service waits on infra and on the migrations landing. Sync dependencies
# (catalog -> staff) are deliberately NOT here: chaining service startup means
# one slow boot holds the whole stack, and a service must answer with an error
# while its peer is still coming up, not refuse to start.
x-service-deps: &service-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

# Identical in all nine. ADMIN_* is not auth-only: config.Validate rejects the
# default admin password in production for every service. Redis likewise — the
# rate limiter is in the global middleware chain everywhere.
x-service-env: &service-env
  ENVIRONMENT: production
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-rabbitmq}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required — see .env.example}@rabbitmq:5672/
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@university.edu.tr}
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD in .env}
  # SPA is served by caddy, not by a service. Same origin -> CORS matches the
  # public URL the browser uses.
  CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
  # Timeout budget, outermost to innermost: caddy 30s (default) > service HTTP
  # server 20s > internal client 10s. An inner timeout that outlives its caller
  # only turns one slow hop into two.
  REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-20}
  DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
  DEMO_MODE: ${DEMO_MODE:-false}
  DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-demo.admin@mydreamcampus.com}
  DEMO_TEACHER_EMAIL: ${DEMO_TEACHER_EMAIL:-ahmet.yilmaz@uni.edu.tr}
  DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:-zeynep.sahin@uni.edu.tr}

x-service: &service
  restart: unless-stopped
  logging: *logging
  depends_on: *service-deps

services:
  postgres:
    image: postgres:18
    container_name: mydreamcampus-postgres
    restart: unless-stopped
    mem_limit: 768m
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}
      # `postgres` is the image's own maintenance database, so the entrypoint
      # skips creating it. No application data lives here: every service owns a
      # database of its own, created by init-databases.sh.
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      # Read by init-databases.sh — the shared password of the per-service
      # roles (auth_svc, staff_svc, ...).
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:?SERVICE_DB_PASSWORD is required — see .env.example}
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs only on an EMPTY volume — an existing one skips it, see the script.
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-service-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    # 4.3 only upgrades from a 4.2 data directory — a broker still on 3.13 has
    # to boot 4.2 once first. `make deploy` enables the old broker's feature
    # flags before swapping images, which every upgrade requires — see
    # DEPLOY.md.
    image: rabbitmq:4.3-management
    container_name: mydreamcampus-rabbitmq
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required — see .env.example}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      # Loaded at boot (management.load_definitions): every queue and binding
      # exists before any service connects, so a message published while its
      # consumer has never run still lands in the queue instead of being
      # discarded by the topic exchange. Mounted as a template — see below.
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.template.json:ro
    # Render the credentials into the definitions file, then hand over to the
    # image's own entrypoint. Configuring a definitions file suppresses default
    # user creation, so the users have to come from the file; keeping them as
    # placeholders in git is what lets the topology be tracked at all.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        sed -e "s|@RABBITMQ_USER@|$$RABBITMQ_DEFAULT_USER|g" \
            -e "s|@RABBITMQ_PASSWORD@|$$RABBITMQ_DEFAULT_PASS|g" \
            /etc/rabbitmq/definitions.template.json > /tmp/definitions.json
        exec docker-entrypoint.sh rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10-alpine
    container_name: mydreamcampus-redis
    restart: unless-stopped
    # Headroom above redis.conf's maxmemory (96mb) for the AOF-rewrite fork.
    mem_limit: 192m
    logging: *logging
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required — see .env.example}"]
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-changeme_redis_secret}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — see .env.example}

  mailhog:
    image: mailhog/mailhog
    container_name: mydreamcampus-mailhog
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    expose:
      - "1025"  # SMTP
      - "8025"  # Web UI

  # One-shot: applies every service's goose migrations to that service's own
  # database, as that service's own role, then exits. Every service waits for
  # it to finish successfully before starting.
  migrate:
    build:
      context: ../..
      dockerfile: new-backend/infrastructure/migrate/Dockerfile
    image: mydreamcampus-migrate:latest
    container_name: mydreamcampus-migrate
    restart: "no"
    mem_limit: 128m
    logging: *logging
    environment:
      PG_HOST: postgres
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:?SERVICE_DB_PASSWORD is required — see .env.example}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Business services ─────────────────────────────────────────────────────
  # No healthcheck on any of them: the images are distroless/static, with no
  # shell, wget or curl, so every `test:` would fail forever and leave the
  # container permanently `unhealthy`. Nothing gates on their health anyway —
  # depends_on above points at infra only. If one is ever needed, add a
  # `-health` flag to the binary and use CMD, not CMD-SHELL.

  auth-service:
    <<: *service
    build:
      context: ../..
      dockerfile: new-backend/services/auth-service/Dockerfile
    image: mydreamcampus-auth:latest
    container_name: mydreamcampus-auth
    # Sized for Argon2id, not for idle: every hash and every verify allocates
    # 64 MB (utils.DefaultParams.Memory), so a handful of concurrent logins —
    # or the burst of user-creation events a seed produces — is hundreds of
    # megabytes of transient buffers. Measured 147 MB after eleven hashes at
    # rest; 192 MB would OOM-kill this container under three parallel logins.
    mem_limit: 384m
    environment:
      <<: *service-env
      PORT: "8081"
      DB_URL: postgres://auth_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/auth?sslmode=disable
    expose:
      - "8081"

  staff-service:
    <<: *service
    build:
      context: ../..
      dockerfile: new-backend/services/staff-service/Dockerfile
    image: mydreamcampus-staff:latest
    container_name: mydreamcampus-staff
    mem_limit: 128m
    environment:
      <<: *service-env
      PORT: "8082"
      DB_URL: postgres://staff_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/staff?sslmode=disable
    expose:
      - "8082"

  student-service:
    <<: *service
    build:
      context: ../..
      dockerfile: new-backend/services/student-service/Dockerfile
    image: mydreamcampus-student:latest
    container_name: mydreamcampus-student
    mem_limit: 128m
    environment:
      <<: *service-env
      PORT: "8083"
      DB_URL: postgres://student_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/student?sslmode=disable
      STAFF_SERVICE_URL: http://staff-service:8082
    expose:
      - "8083"

  catalog-service:
    <<: *service
    build:
      context: ../..
      dockerfile: new-backend/services/catalog-service/Dockerfile
    image: mydreamcampus-catalog:latest
    container_name: mydreamcampus-catalog
    mem_limit: 128m
    environment:
      <<: *service-env
      PORT: "8084"
      DB_URL: postgres://catalog_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/catalog?sslmode=disable
      STAFF_SERVICE_URL: http://staff-service:8082
      MEAL_SERVICE_URL: http://meal-service:8088
    expose:
      - "8084"

  enrollment-service:
    <<: *service
    build:
      context: ../..
      dockerfile: new-backend/services/enrollment-service/Dockerfile
    image: mydreamcampus-enrollment:latest
    container_name: mydreamcampus-enrollment
    mem_limit: 128m
    environment:
      <<: *service-env
      PORT: "8085"
      DB_URL: postgres://enrollment_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/enrollment?sslmode=disable
      STUDENT_SERVICE_URL: http://student-service:8083
      CATALOG_SERVICE_URL: http://catalog-service:8084
    expose:
      - "8085"

  attendance-service:
    <<: *service
    build:
      context: ../..
      dockerfile: new-backend/services/attendance-service/Dockerfile
    image: mydreamcampus-attendance:latest
    container_name: mydreamcampus-attendance
    mem_limit: 192m
    environment:
      <<: *service-env
      PORT: "8086"
      DB_URL: postgres://attendance_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/attendance?sslmode=disable
      CATALOG_SERVICE_URL: http://catalog-service:8084
    expose:
      - "8086"

  grades-service:
    <<: *service
    build:
      context: ../..
      dockerfile: new-backend/services/grades-service/Dockerfile
    image: mydreamcampus-grades:latest
    container_name: mydreamcampus-grades
    mem_limit: 128m
    environment:
      <<: *service-env
      PORT: "8087"
      DB_URL: postgres://grades_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/grades?sslmode=disable
      CATALOG_SERVICE_URL: http://catalog-service:8084
    expose:
      - "8087"

  meal-service:
    <<: *service
    build:
      context: ../..
      dockerfile: new-backend/services/meal-service/Dockerfile
    image: mydreamcampus-meal:latest
    container_name: mydreamcampus-meal
    mem_limit: 192m
    environment:
      <<: *service-env
      PORT: "8088"
      DB_URL: postgres://meal_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/meal?sslmode=disable
      PAYMENT_SERVICE_URL: http://payment-service:8089
      QR_SECRET: ${QR_SECRET:?set QR_SECRET in .env}
    expose:
      - "8088"

  payment-service:
    <<: *service
    build:
      context: ../..
      dockerfile: new-backend/services/payment-service/Dockerfile
    image: mydreamcampus-payment:latest
    container_name: mydreamcampus-payment
    mem_limit: 128m
    environment:
      <<: *service-env
      PORT: "8089"
      DB_URL: postgres://payment_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/payment?sslmode=disable
    expose:
      - "8089"

  notification:
    <<: *service
    build:
      context: ../..
      dockerfile: new-backend/services/notification-service/Dockerfile
    image: mydreamcampus-notification:latest
    container_name: mydreamcampus-notification
    mem_limit: 128m
    environment:
      # Its own NOTIF_-prefixed config, and its own role on the shared Postgres
      # — the separate notification-postgres container is gone.
      NOTIF_DATABASE_URL: postgres://notification_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/notification?sslmode=disable
      NOTIF_RABBITMQ_URL: amqp://${RABBITMQ_USER:-rabbitmq}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required — see .env.example}@rabbitmq:5672/
      # MailHog catches everything by default — nothing leaves the host.
      # Point SMTP_* in .env at a real relay for reset and welcome mail to
      # reach anyone; see .env.example.
      NOTIF_SMTP_HOST: ${SMTP_HOST:-mailhog}
      NOTIF_SMTP_PORT: ${SMTP_PORT:-1025}
      NOTIF_SMTP_USERNAME: ${SMTP_USERNAME:-}
      NOTIF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIF_SMTP_FROM: ${SMTP_FROM:-noreply@mydreamcampus.com}
      NOTIF_APP_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
    expose:
      - "9090"

  # One-shot: seeds demo teachers/courses/students through the real admin API
  # once the stack is up. Idempotent (skips if demo data exists). SEED_DEMO=false
  # in .env disables it.
  seed:
    build:
      context: ../..
      dockerfile: new-backend/infrastructure/seed/Dockerfile
    image: mydreamcampus-seed:latest
    container_name: mydreamcampus-seed
    restart: "no"
    mem_limit: 64m
    logging: *logging
    environment:
      # Straight to each service, not through Caddy: the edge redirects :80 to
      # https whenever PUBLIC_HOST carries no scheme, and none of this needs an
      # edge. seed.sh defaults to these same values.
      AUTH_SERVICE_URL: http://auth-service:8081
      STAFF_SERVICE_URL: http://staff-service:8082
      STUDENT_SERVICE_URL: http://student-service:8083
      CATALOG_SERVICE_URL: http://catalog-service:8084
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@university.edu.tr}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD in .env}
      DEMO_TEACHER_EMAIL: ${DEMO_TEACHER_EMAIL:-ahmet.yilmaz@uni.edu.tr}
      DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:-zeynep.sahin@uni.edu.tr}
      # One DSN per database the relational seed writes to. A single DB_URL
      # cannot work any more: the eight schemas it fills are eight databases.
      PG_HOST: postgres
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:?SERVICE_DB_PASSWORD is required — see .env.example}
    depends_on:
      auth-service:
        condition: service_started
      staff-service:
        condition: service_started
      student-service:
        condition: service_started
      catalog-service:
        condition: service_started

  # Public edge: serves the SPA and reverse-proxies each /api prefix to its own
  # service. Fetches a real Let's Encrypt cert for SITE_ADDRESS automatically.
  #
  # No depends_on: Caddy serving the SPA does not need a backend, and gating it
  # on nine services would trade a working page + API errors for a blank screen
  # whenever one service is slow to boot.
  caddy:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    image: mydreamcampus-caddy:latest
    container_name: mydreamcampus-caddy
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
    environment:
      SITE_ADDRESS: ${PUBLIC_HOST:-localhost}
    # Host-side port is overridable because rootless Docker cannot bind below
    # 1024 without extra capabilities: HTTP_PORT=8080 works unprivileged.
    # Caddy always listens on 80 inside the container.
    #
    # Only :80 lives here. When something fronts the stack (Cloudflare Tunnel)
    # TLS is that edge's job, and Caddy terminating it too would mean two
    # processes contending for host :443. The standalone overlay publishes :443
    # for the setups where Caddy IS the outermost edge.
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  caddy-data:
  caddy-config:
