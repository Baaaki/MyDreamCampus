# MyDreamCampus modular monolith infrastructure.
# Plan section 11 Faz 0 — single Postgres for the monolith, separate Postgres
# for notification, RabbitMQ, Redis, MailHog. No Traefik (plan section 7).

name: mydreamcampus

services:
  postgres:
    image: postgres:18
    container_name: mydreamcampus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mydreamcampus
      PGDATA: /var/lib/postgresql/data/pgdata
    # 127.0.0.1 binding: only the host reaches infra ports, so an
    # exposed VPS doesn't serve Postgres/Redis/RabbitMQ to the internet
    # even if the cloud firewall is misconfigured.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-dbs.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydreamcampus"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-postgres:
    image: postgres:18
    container_name: mydreamcampus-notification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: notification
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql
      - ./postgres/init-notification-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mydreamcampus-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mydreamcampus-redis
    restart: unless-stopped
    # requirepass comes from env so it stays in sync with the monolith's
    # REDIS_PASSWORD default — token blacklist lives here, never run open.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-changeme_redis_secret}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-changeme_redis_secret}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis_secret}

  mailhog:
    image: mailhog/mailhog
    container_name: mydreamcampus-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # Web UI

volumes:
  postgres-data:
  notification-postgres-data:
  rabbitmq-data:
  redis-data:
