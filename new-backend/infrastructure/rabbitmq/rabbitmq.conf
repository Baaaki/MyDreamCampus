# RabbitMQ Configuration
#
# Documentation: https://www.rabbitmq.com/docs/configure
#
# This configuration file is mounted to /etc/rabbitmq/rabbitmq.conf

# Networking
listeners.tcp.default = 5672

# Management Plugin
management.tcp.port = 15672
# Pre-declares the whole topology at boot. Without it a message published
# before its consumer has ever started is dropped: the exchange exists, the
# binding does not, and a topic exchange discards what it cannot route.
#
# This path is the RENDERED file, not the one in git. Configuring a definitions
# file makes RabbitMQ skip creating the default user from RABBITMQ_DEFAULT_USER
# — it expects the definitions to carry the users — so every service gets a 403
# unless the file has them. The tracked definitions.json therefore holds
# @RABBITMQ_USER@ / @RABBITMQ_PASSWORD@ placeholders and the container renders
# them from the environment at start; real credentials never reach git.
#
# The core keys, not management.load_definitions: current releases document
# only these, and they need no plugin to be loaded first.
definitions.import_backend = local_filesystem
definitions.local.path = /tmp/definitions.json

# Memory
vm_memory_high_watermark.relative = 0.6

# Disk Space
disk_free_limit.absolute = 2GB

# Message TTL (optional)
# Default message time-to-live for queues (24 hours)
# default_vhost.default_queue_type = quorum

# Heartbeat
heartbeat = 60

# Logging
log.file.level = info
log.console = true
log.console.level = info
