# Redis Configuration
#
# Documentation: https://redis.io/docs/latest/operate/oss_and_stack/management/config/
#
# This configuration file is mounted to /usr/local/etc/redis/redis.conf

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General
daemonize no
supervised no
loglevel notice
databases 16

# Snapshotting (Persistence)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Replication
# replicaof <masterip> <masterport>

# Security
# requirepass is injected via docker-compose command args from
# REDIS_PASSWORD so it stays in sync with the monolith config.
# Do not set it here — a stale value would silently win.
# maxclients 10000

# Memory Management
#
# This Redis is a store, not a cache: it holds the token blacklist, the
# minimum token versions, login lockouts, reset tokens, idempotency records
# and rate-limit windows. Under allkeys-lru a full memory silently evicted
# them — a revoked token became valid again, a retried payment ran twice.
# noeviction refuses writes instead, which the services already treat as a
# Redis error (fail-open or fail-closed per path). Every key carries a TTL,
# so memory drains on its own.
#
# maxmemory stays well under the container's mem_limit: the limit counts
# the fork that rewrites the AOF, and a Redis that outgrows it is OOM-killed
# rather than refusing writes.
maxmemory 96mb
maxmemory-policy noeviction

# Append Only File (AOF)
#
# RDB snapshots alone lose everything since the last save on a restart —
# including revocations, which would make logged-out tokens valid again.
# everysec bounds the loss to about one second.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128
