version: "2"
sql:
  - engine: "postgresql"
    queries: "./sql/queries"
    # bootstrap first: migrations assume the schema already exists
    # (init-dbs.sql creates it), but sqlc's catalog starts empty.
    schema:
      - "./sql/sqlc/bootstrap.sql"
      - "./sql/migrations"
    gen:
      go:
        package: "db"
        out: "./db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        # Strip the `attendance` schema prefix from generated Go names.
        # Keys are the snake_case source names (schema + singular table),
        # same pattern as course_catalog — CamelCase keys are ignored.
        rename:
          attendance_students_view: "StudentView"
          attendance_courses_view: "CourseView"
          attendance_enrollments_view: "EnrollmentView"
          attendance_attendance_session: "AttendanceSession"
          attendance_attendance_record: "AttendanceRecord"
          attendance_academic_period: "AcademicPeriod"
          attendance_outbox_event: "OutboxEvent"
          attendance_processed_event: "ProcessedEvent"
          attendance_session_type_enum: "SessionTypeEnum"
          attendance_outbox_status_enum: "OutboxStatusEnum"
