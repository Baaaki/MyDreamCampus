version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/sql/queries"
    # sqlc_schema first: it creates the schema the migrations reference.
    schema:
      - "./internal/sql/sqlc_schema"
      - "./internal/sql/migrations"
    gen:
      go:
        package: "db"
        out: "./internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        # Strip the `payment` schema prefix from the generated Go names.
        rename:
          payment_outbox_event: "OutboxEvent"
          payment_outbox_status_enum: "OutboxStatusEnum"
